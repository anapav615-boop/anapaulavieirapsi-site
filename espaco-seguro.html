<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espaço Seguro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins', sans-serif;
background: radial-gradient(circle at top,#f5f0ff,#eef7f2);
color:#4b3f72;
}

.container{max-width:1100px;margin:auto;padding:20px}

.hero{
background:linear-gradient(135deg,#ffffff,#f6f1ff);
padding:30px;
border-radius:25px;
box-shadow:0 15px 35px rgba(107,72,168,0.1);
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.card{
padding:18px;
border-radius:20px;
background:linear-gradient(135deg,#ffffff,#efe8ff);
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
transition:.3s;
}

.card:hover{transform:translateY(-5px);box-shadow:0 15px 30px rgba(107,72,168,0.15)}

.section{margin-top:40px}

.audio-card{
background:linear-gradient(135deg,#ffffff,#eef7f2);
padding:20px;
border-radius:20px;
margin-bottom:15px;
}

.devolutiva{
display:none;
background:linear-gradient(135deg,#6b48a8,#7fbf9a);
color:white;
padding:20px;
border-radius:20px;
margin-top:20px;
display:flex;
align-items:center;
gap:15px;
}

.devolutiva img{width:60px;height:60px;border-radius:50%}

.btn{background:#6b48a8;color:white;padding:10px;border:none;border-radius:15px;margin-top:10px}

.btn-whats{background:#25D366;color:white;padding:10px;border:none;border-radius:15px;margin-top:10px}

textarea{width:100%;height:100px;border-radius:15px;padding:10px}

</style>
</head>

<body>
<div class="container">

<div class="hero">
<h1>Espaço Seguro</h1>
<p>Como você está agora? Escolha por onde começar.</p>

<div class="cards">
<div class="card"><i class="fa-solid fa-brain"></i>Check-in emocional</div>
<div class="card"><i class="fa-solid fa-pen"></i>Diário das emoções</div>
<div class="card"><i class="fa-solid fa-headphones"></i>Áudios de acolhimento</div>
<div class="card"><i class="fa-solid fa-spa"></i>Exercícios terapêuticos</div>
</div>
</div>

<div class="section">
<h2>Diário</h2>
<p>Você pode escrever sem se corrigir. Só seja verdadeiro.</p>
<textarea id="texto"></textarea>
<button class="btn" onclick="salvar()">Salvar</button>

<div class="devolutiva" id="box">
<img src="imagens/caricatura.png">
<div>
<p id="resposta"></p>
<button class="btn-whats">Falar comigo</button>
</div>
</div>
</div>

<div class="section">
<h2>Áudios</h2>

<div class="audio-card">
<p>Respire devagar</p>
<audio controls src="audios/audio1.mp3"></audio>
</div>

<div class="audio-card">
<p>Volte para o momento presente</p>
<audio controls src="audios/audio2.mp3"></audio>
</div>

</div>

</div>

<script>
function salvar(){
let texto=document.getElementById("texto").value.toLowerCase();
let resposta="";

if(texto.includes("ansiedade")){
resposta="Percebo que sua mente pode estar acelerada agora. Talvez você só precise respirar um pouco.";
}else{
resposta="Você não precisa dar conta de tudo hoje. Vá com calma.";
}

document.getElementById("resposta").innerText=resposta;
document.getElementById("box").style.display="flex";
}
</script>

</body>
</html>
